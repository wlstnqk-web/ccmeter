[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccmeter"
dynamic = ["version"]
description = "Measure your actual Claude Code usage limits instead of guessing"
authors = [{name = "Tyson Chan", email = "tyson.chan@proton.me"}]
keywords = ["claude", "anthropic", "usage", "limits", "transparency", "metering"]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

dependencies = [
    "fncli>=0.1.1",
]

[project.scripts]
ccmeter = "ccmeter.cli:main"

[project.urls]
Repository = "https://github.com/iteebz/ccmeter"
Issues = "https://github.com/iteebz/ccmeter/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.4.0",
    "ruff>=0.13.0",
]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false

# Tests reach into module internals on purpose — `_write_health`, `_event`,
# `_status_label` are where the behaviour worth pinning actually lives, and a test
# that only exercises the public surface would not have caught the health-file bug
# that silently capped collection at the first poll cycle.
#
# ⛔Scoped to `tests`, not global. Under strict, `reportPrivateUsage` still applies to
#   `ccmeter/` itself, so a module reaching into another module's internals is still
#   an error. Turning it off globally would buy a green check by removing the rule
#   from the code it was written for.
#
# The alternative — a `# pyright: ignore` on each call — puts the decision in the
# wrong place: it makes every new test carry a suppression comment, and a file-level
# suppression hides whatever *else* goes wrong in that file later.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
root = "."

[tool.hatch.version]
path = "ccmeter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ccmeter"]
